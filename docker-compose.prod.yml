# Production: HTTPS Nginx, app behind a private network and ClamAV mandatory.
# Requires Docker Compose v2.24+ (`!reset` removes inherited development mounts/ports).
# Provision ./certs/fullchain.pem and ./certs/privkey.pem before starting.
name: kemta-suivi-prod

services:
  web:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "false"
    restart: unless-stopped
    environment:
      DJANGO_ENV: production
      DEBUG: "false"
      INSTALL_DEV: "false"
      ANTIVIRUS_REQUIRED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      MEDIA_X_ACCEL_REDIRECT: "true"
      SECURE_SSL_REDIRECT: "true"
    # Supprime le bind mount de code et le port de développement hérités du compose de base.
    volumes: !reset
      - media:/app/var/media
    ports: !reset []
    depends_on:
      clamav:
        condition: service_started

  worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "false"
    restart: unless-stopped
    environment:
      DJANGO_ENV: production
      DEBUG: "false"
      ANTIVIRUS_REQUIRED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      MEDIA_X_ACCEL_REDIRECT: "true"
    volumes: !reset
      - media:/app/var/media
    depends_on:
      clamav:
        condition: service_started

  beat:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "false"
    restart: unless-stopped
    environment:
      DJANGO_ENV: production
      DEBUG: "false"
      ANTIVIRUS_REQUIRED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      MEDIA_X_ACCEL_REDIRECT: "true"
    volumes: !reset []

  frontend:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    volumes: !reset
      - media:/app/var/media:ro
      - ${TLS_CERTS_DIR:-./certs}:/etc/nginx/certs:ro
      - ${ACME_WEBROOT_DIR:-./certbot/www}:/var/www/certbot:ro
    ports: !reset
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"

  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.4}
    restart: unless-stopped
    volumes:
      - clamavdata:/var/lib/clamav
    expose:
      - "3310"

  db:
    restart: unless-stopped
    ports: !reset []

  redis:
    restart: unless-stopped
    ports: !reset []

volumes:
  clamavdata:
